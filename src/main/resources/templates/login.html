<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Учет успеваемости студентов</title>

    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-container">

    <div class="logo-area">
        <h1>Учет успеваемости</h1>
        <p>Электронный кабинет студента и преподавателя</p>
    </div>


    <form id="login-form">


        <div class="form-group">
                        <label for="username">Логин</label>
            <div class="input-wrapper">
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Введите ваш логин"
                        required
                        autocomplete="username"
                >
            </div>
        </div>


        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="input-wrapper">
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        required
                        autocomplete="current-password"
                >
            </div>
        </div>


        <button type="submit" class="submit-btn">Войти в систему</button>
        <p id="login-message" aria-live="polite"></p>
    </form>


</div>

<script src="/api-client.js"></script>
<script>
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');

    function destinationFor(user) {
        const requestedUrl = new URLSearchParams(window.location.search).get('returnUrl');
        if (requestedUrl) {
            const destination = new URL(requestedUrl, window.location.origin);
            if (destination.origin === window.location.origin
                    && destination.pathname.startsWith('/')
                    && !destination.pathname.startsWith('/api/')
                    && destination.pathname !== '/login') {
                return destination.pathname + destination.search + destination.hash;
            }
        }
        if (user.role === 'STUDENT') {
            return '/me/courses';
        }
        if (user.role === 'TEACHER' || user.role === 'DEAN') {
            return '/courses';
        }
        if (user.role === 'ADMIN') {
            return '/admin/users';
        }
        return null;
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        loginMessage.textContent = 'Выполняется вход';
        try {
            const user = await CsasApi.request('/api/auth/login', {
                method: 'POST',
                json: {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                }
            });
            const destination = destinationFor(user);
            if (destination) {
                window.location.assign(destination);
                return;
            }
            loginMessage.textContent = 'Вход выполнен, но страницы для этой роли пока нет.';
        } catch (error) {
            loginMessage.textContent = error.message;
        }
    });
</script>

</body>
</html>
