<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Учет успеваемости студентов</title>

    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-container">

    <div class="logo-area">
        <div class="icon">🎓</div>
        <h1>Учет успеваемости</h1>
        <p>Электронный кабинет студента и преподавателя</p>
    </div>


    <form id="login-form">


        <div class="form-group">
            <label for="username">Логин или Email</label>
            <div class="input-wrapper">
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Введите ваш логин"
                        required
                        autocomplete="username"
                >
            </div>
        </div>


        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="input-wrapper">
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                >
            </div>
        </div>


        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" name="remember"> Запомнить меня
            </label>
            <a href="#" class="forgot-password">Забыли пароль?</a>
        </div>


        <button type="submit" class="submit-btn">Войти в систему</button>
        <p id="login-message" aria-live="polite"></p>
    </form>


    <div class="login-footer">
        &copy; 2026 Университетская информационная система
    </div>
</div>

<script>
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');

    async function getCsrfToken() {
        const response = await fetch('/api/auth/csrf', {credentials: 'same-origin'});
        if (!response.ok) {
            throw new Error('Не удалось начать вход. Попробуйте обновить страницу.');
        }
        return response.json();
    }

    function destinationFor(user) {
        const requestedUrl = new URLSearchParams(window.location.search).get('returnUrl');
        if (requestedUrl) {
            const destination = new URL(requestedUrl, window.location.origin);
            if (destination.origin === window.location.origin
                    && destination.pathname.startsWith('/')
                    && !destination.pathname.startsWith('/api/')
                    && destination.pathname !== '/login') {
                return destination.pathname + destination.search + destination.hash;
            }
        }
        if (user.role === 'STUDENT') {
            return '/me/courses';
        }
        if (user.role === 'TEACHER' || user.role === 'DEAN') {
            return '/courses';
        }
        return null;
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        loginMessage.textContent = 'Выполняется вход…';
        try {
            const token = await getCsrfToken();
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    [token.headerName]: token.token
                },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const user = await response.json();
            if (!response.ok) {
                throw new Error(user.message || 'Не удалось войти. Проверьте логин и пароль.');
            }
            const destination = destinationFor(user);
            if (destination) {
                window.location.assign(destination);
                return;
            }
            loginMessage.textContent = 'Вход выполнен, но страницы для этой роли пока нет.';
        } catch (error) {
            loginMessage.textContent = error.message;
        }
    });
</script>

</body>
</html>
