<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Посещаемость | Учёт успеваемости</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/api-client.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/attendance-sheet.js" defer></script>
</head>
<body data-page="attendanceSheet" th:attr="data-sheet-id=${sheet.id}">
<div th:replace="~{fragments/menu :: menu}"></div>
<main class="page-shell">
    <a th:href="@{/courses/{id}(id=${sheet.course.id})}">Вернуться к курсу</a>
    <h1 class="page-title" id="sheet-title">Ведомость посещаемости</h1>
    <p class="page-description" id="sheet-summary"></p>
    <p class="notice" data-global-notice role="status">Загрузка ведомости.</p>
    <p class="form-actions">
        <a class="button button-secondary" id="attendance-report-link" hidden download>Скачать ведомость XLSX</a>
        <a class="button button-secondary" id="attendance-report-pdf-link" hidden download>Скачать ведомость PDF</a>
    </p>
    <section class="panel" id="lecture-form-panel" hidden>
        <h2>Добавить лекцию</h2>
        <form class="field-grid" id="lecture-form">
            <label class="field">
                <span>Дата</span>
                <input name="date" type="date" required>
            </label>
            <label class="field">
                <span>Тема лекции</span>
                <input name="title" maxlength="200" required>
            </label>
            <div class="field-full form-actions">
                <button class="button" type="submit">Добавить лекцию</button>
            </div>
        </form>
    </section>
    <section class="panel">
        <h2>Лекции и посещаемость</h2>
        <div id="lectures"></div>
    </section>
    <section class="panel" id="attendance-actions" hidden>
        <h2>Действия с ведомостью</h2>
        <div class="form-actions" id="attendance-action-buttons"></div>
    </section>
</main>
</body>
</html>
