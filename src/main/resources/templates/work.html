<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод баллов | Базы данных</title>
    <link rel="stylesheet" href="../static/css/work.css">
</head>
<body>

<div class="page-container">


    <div class="navigation-back">
        <a href="course-detail.html" class="back-link">← Вернуться к журналу курса</a>
    </div>


    <header class="work-header">
        <div class="work-info">
            <span class="course-context">Базы данных • Группа ИСТ-21</span>
            <h1>Лабораторная работа №1</h1>
            <p class="max-score-info">Максимальный балл за работу: <strong>20</strong></p>
        </div>
    </header>


    <form action="/save-grades" method="POST">


        <input type="hidden" name="workId" value="101">


        <div class="students-list-container">


            <div class="list-header">
                <span class="hdr-fio">ФИО Студента</span>
                <span class="hdr-score">Балл</span>
            </div>


            <div class="student-row">
                <label for="student-1" class="student-name">Иванов А.А.</label>
                <div class="input-group">

                    <input
                            type="number"
                            id="student-1"
                            name="grade_1"
                            class="score-input"
                            placeholder="0"
                            min="0"
                            max="20"
                            step="0.5"
                            value="18"
                    >
                    <span class="score-limit">/ 20</span>
                </div>
            </div>


            <div class="student-row">
                <label for="student-2" class="student-name">Петрова М.И.</label>
                <div class="input-group">
                    <input
                            type="number"
                            id="student-2"
                            name="grade_2"
                            class="score-input"
                            placeholder="0"
                            min="0"
                            max="20"
                            step="0.5"
                            value="20"
                    >
                    <span class="score-limit">/ 20</span>
                </div>
            </div>


            <div class="student-row">
                <label for="student-3" class="student-name">Сидоров К.В.</label>
                <div class="input-group">
                    <input
                            type="number"
                            id="student-3"
                            name="grade_3"
                            class="score-input"
                            placeholder="Нет оценки"
                            min="0"
                            max="20"
                            step="0.5"
                    >
                    <span class="score-limit">/ 20</span>
                </div>
            </div>

        </div>


        <div class="form-actions">
            <button type="submit" class="save-btn">💾 Сохранить изменения</button>
        </div>

    </form>

</div>

</body>
</html>
