<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка 403 | Доступ ограничен</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7fafc;
            color: #2d3748;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
            background: #ffffff;
            padding: 48px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 1px solid #edf2f7;
        }

        .error-code {
            font-size: 96px;
            font-weight: 800;
            color: #e53e3e; /* Красный цвет акцентирует внимание на запрете */
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            color: #1a202c;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            background-color: #4a5568; /* Нейтральный цвет кнопки */
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-home:hover {
            background-color: #2d3748;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-icon">🔒</div>
    <div class="error-code">403</div>
    <h1>Доступ ограничен</h1>
    <p>У вашей учетной записи недостаточно прав для просмотра этой страницы. Если вы считаете, что это ошибка, пожалуйста, обратитесь в деканат.</p>
    <a href="/" class="btn-home">Вернуться на главную</a>
</div>

</body>
</html>
