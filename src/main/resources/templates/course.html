<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Курс | Учёт успеваемости</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/api-client.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/course.js" defer></script>
</head>
<body data-page="course" th:attr="data-course-id=${course.courseId}">
<div th:replace="~{fragments/menu :: menu}"></div>
<main class="page-shell">
    <a href="/courses" data-roles="TEACHER,DEAN" hidden>К списку курсов</a>
    <a href="/me/courses" data-roles="STUDENT" hidden>К списку курсов</a>
    <h1 class="page-title" id="course-title">Курс</h1>
    <p class="page-description" id="course-summary"></p>
    <p class="notice" data-global-notice role="status">Загрузка курса.</p>
    <section class="panel" id="course-management" th:if="${isDean}">
        <h2>Управление курсом</h2>
        <div class="form-actions" id="course-management-actions">
            <button class="button button-secondary" id="course-edit-open" type="button">Изменить курс</button>
            <button class="button button-danger" id="course-delete" type="button">Удалить курс</button>
        </div>
        <p class="field-hint">Удалить можно только незавершённый курс без заданий и заполненных ведомостей.</p>
        <form id="course-edit-form" class="field-grid" hidden>
            <label class="field">
                <span>Дисциплина</span>
                <select name="disciplineId" required></select>
            </label>
            <label class="field">
                <span>Группа</span>
                <select name="groupId" required></select>
            </label>
            <label class="field">
                <span>Преподаватель</span>
                <select name="teacherId" required></select>
            </label>
            <label class="field">
                <span>Семестр начала</span>
                <select name="startSemesterId" required></select>
            </label>
            <label class="field">
                <span>Семестр окончания</span>
                <select name="endSemesterId" required></select>
            </label>
            <p class="field-hint field-full">Тип курса после создания изменить нельзя.</p>
            <div class="form-actions field-full">
                <button class="button" type="submit">Сохранить изменения</button>
                <button class="button button-secondary" id="course-edit-cancel" type="button">Отмена</button>
            </div>
        </form>
    </section>
    <section class="panel" id="course-links"></section>
    <section class="panel" id="course-actions" hidden>
        <h2>Действия с курсом</h2>
        <form id="work-form" class="field-grid" hidden>
            <div class="field field-full">
                <label for="work-title">Название работы</label>
                <input id="work-title" name="title" maxlength="100" required>
            </div>
            <div class="field">
                <label for="work-date">Дата</label>
                <input id="work-date" name="date" type="date" required>
            </div>
            <div class="field">
                <label for="work-max-score">Максимальный балл</label>
                <input id="work-max-score" name="maxScore" type="number" min="1" required>
            </div>
            <div class="field-full form-actions">
                <button class="button" type="submit">Добавить работу</button>
            </div>
        </form>
        <div id="course-action-buttons" class="form-actions"></div>
        <form id="control-sheet-form" class="field-grid" hidden>
            <div class="field">
                <label for="grade-5">Порог оценки 5</label>
                <input id="grade-5" name="grade5From" type="number" min="0" max="100" value="85" required>
            </div>
            <div class="field">
                <label for="grade-4">Порог оценки 4</label>
                <input id="grade-4" name="grade4From" type="number" min="0" max="100" value="70" required>
            </div>
            <div class="field">
                <label for="grade-3">Порог оценки 3</label>
                <input id="grade-3" name="grade3From" type="number" min="0" max="100" value="50" required>
            </div>
            <div class="field-full form-actions">
                <button class="button" type="submit">Создать контрольную ведомость</button>
            </div>
        </form>
        <form th:if="${canReopen}" th:action="@{/courses/{courseId}/reopen(courseId=${course.courseId})}"
              method="post" class="form-actions">
            <button class="button button-secondary" type="submit">Переоткрыть в следующем семестре</button>
        </form>
    </section>
    <section class="panel" id="works-panel" hidden>
        <h2>Работы и баллы</h2>
        <p class="field-hint" id="scores-readonly" hidden></p>
        <div class="data-table-wrap">
            <table class="data-table" id="works-table"></table>
        </div>
        <div id="work-editors"></div>
    </section>
</main>
</body>
</html>
