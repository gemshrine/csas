<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал курса | Базы данных</title>
  <link rel="stylesheet" href="../static/css/course.css">
</head>
<body>

<div class="page-container">


  <header class="course-header">
    <div class="course-info-block">
      <h1 class="course-title">Базы данных</h1>
      <span class="divider">•</span>
      <span class="info-tag group-tag">ИСТ-21</span>
      <span class="divider">•</span>
      <span class="info-tag semester-tag">осень 2026</span>
      <span class="divider">•</span>
      <span class="status-badge active-status">ИДЁТ</span>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary">➕ Добавить работу</button>
      <button class="btn btn-secondary">🔒 Завершить курс</button>
    </div>
  </header>


  <section class="table-container">
    <table class="grades-table">
      <thead>

      <tr>
        <th class="col-fio">ФИО</th>
        <th>Лаб.1</th>
        <th>Лаб.2</th>
        <th>К/р</th>
        <th>Семинар</th>
        <th class="col-rating">Рейтинг</th>
      </tr>

      <tr class="max-scores">
        <td></td>
        <td>(20)</td>
        <td>(20)</td>
        <td>(40)</td>
        <td>(5)</td>
        <td></td>
      </tr>
      </thead>
      <tbody>

      <tr>
        <td class="student-name">Иванов А.А.</td>
        <td class="score">18</td>
        <td class="score">15</td>
        <td class="score">32</td>
        <td class="score">5</td>
        <td class="rating-value">82.4</td>
      </tr>

      <tr>
        <td class="student-name">Петрова М.И.</td>
        <td class="score">20</td>
        <td class="score">19</td>
        <td class="score">38</td>
        <td class="score">4</td>
        <td class="rating-value high-score">95.3</td>
      </tr>
      </tbody>
    </table>
  </section>

</div>

</body>
</html>
