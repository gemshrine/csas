<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Курсы | Учёт успеваемости</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/api-client.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/courses.js" defer></script>
</head>
<body data-page="courses">
<div th:replace="~{fragments/menu :: menu}"></div>
<main class="page-shell">
    <h1 class="page-title">Курсы</h1>
    <p class="page-description">Курсы и ведомости, доступные вашей учётной записи.</p>
    <div class="toolbar">
        <input class="search-input course-search" id="course-search" type="search" aria-label="Поиск курсов"
               placeholder="Поиск по дисциплине или группе">
        <a class="button" href="/courses/new" data-roles="DEAN" hidden>Создать курс</a>
    </div>
    <p class="notice" data-global-notice role="status">Загрузка курсов.</p>
    <div class="data-table-wrap">
        <table class="data-table">
            <thead>
            <tr>
                <th>Дисциплина</th>
                <th>Группа</th>
                <th>Тип курса</th>
                <th>Период</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="courses-body"></tbody>
        </table>
    </div>
</main>
</body>
</html>
